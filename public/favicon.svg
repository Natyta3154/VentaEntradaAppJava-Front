<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado Dorado Premium -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE072" />
      <stop offset="40%" stop-color="#F5B324" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Brillo dorado estelar -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Sombra suave para profundidad -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EAB308" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo Dark Squircle -->
  <rect width="512" height="512" rx="128" fill="#0c0d12" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 215, 0, 0.15)" stroke-width="3" />

  <!-- GRUPO PRINCIPAL CON EFECTO Y CENTRADO -->
  <g filter="url(#glow)" transform="translate(0, 8)">
    
    <!-- ARCO SUPERIOR DORADO -->
    <path d="M 188 178 A 120 120 0 0 1 352 195" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- ESTRELLAS / DESTELLOS SUPERIORES DERECHOS -->
    <!-- Estrella grande -->
    <path d="M 370 120 Q 370 142 392 142 Q 370 142 370 164 Q 370 142 348 142 Q 370 142 370 120 Z" 
          fill="url(#sparkleGrad)" />
    
    <!-- Estrella pequeña -->
    <path d="M 405 160 Q 405 174 419 174 Q 405 174 405 188 Q 405 174 391 174 Q 405 174 405 160 Z" 
          fill="url(#sparkleGrad)" />

    <!-- TICKET DORADO ROTADO CON SILUETAS -->
    <g transform="translate(256, 290) rotate(-22)">
      
      <!-- CUERPO DEL TICKET DORADO (con muescas laterales) -->
      <path d="M -130 -65 
               L 130 -65 
               A 22 22 0 0 0 130 -15 
               L 130 65 
               L -130 65 
               A 22 22 0 0 0 -130 15 
               Z" 
            fill="url(#goldGrad)" 
            rx="18" />

      <!-- Borde refinado del ticket con esquinas redondeadas -->
      <rect x="-140" y="-70" width="280" height="140" rx="26" fill="url(#goldGrad)" />
      
      <!-- Muescas circulares negras en los bordes del ticket -->
      <circle cx="-140" cy="0" r="22" fill="#0c0d12" />
      <circle cx="140" cy="0" r="22" fill="#0c0d12" />

      <!-- SILUETAS DE LA FIESTA / PÚBLICO (Negro #0c0d12) -->
      <g fill="#0c0d12">
        <!-- Base de la multitud -->
        <path d="M -135 25 Q -60 18 0 24 Q 70 18 135 26 L 135 70 L -135 70 Z" />

        <!-- Persona 1 (Izquierda) -->
        <circle cx="-85" cy="5" r="10" />
        <path d="M -92 14 Q -85 10 -78 14 L -72 40 L -98 40 Z" />
        <!-- Brazo izquierdo levantado -->
        <path d="M -94 18 Q -108 -8 -112 -28 Q -108 -30 -104 -24 Q -98 -6 -88 16 Z" />
        <!-- Brazo derecho levantado -->
        <path d="M -76 18 Q -68 -2 -60 -20 Q -56 -18 -60 -12 Q -68 6 -74 22 Z" />

        <!-- Persona 2 (Centro - Izquierda) -->
        <circle cx="-42" cy="-5" r="11" />
        <path d="M -50 4 Q -42 0 -34 4 L -28 35 L -56 35 Z" />
        <!-- Brazo levantado -->
        <path d="M -48 8 Q -58 -18 -64 -35 Q -60 -37 -56 -32 Q -50 -14 -42 8 Z" />

        <!-- Persona 3 (Centro - Principal) -->
        <circle cx="0" cy="-12" r="12" />
        <path d="M -10 -2 Q 0 -6 10 -2 L 18 35 L -18 35 Z" />
        <!-- Dos brazos eufóricos en V -->
        <path d="M -8 -1 Q -24 -26 -32 -48 Q -27 -50 -23 -44 Q -16 -24 0 -1 Z" />
        <path d="M 8 -1 Q 26 -28 36 -52 Q 41 -50 37 -44 Q 28 -22 10 -1 Z" />

        <!-- Persona 4 (Centro - Derecha) -->
        <circle cx="48" cy="-6" r="11" />
        <path d="M 39 3 Q 48 -1 57 3 L 64 35 L 34 35 Z" />
        <!-- Brazo levantado hacia la derecha -->
        <path d="M 54 6 Q 72 -20 82 -42 Q 87 -40 83 -34 Q 74 -14 58 8 Z" />

        <!-- Persona 5 (Derecha) -->
        <circle cx="90" cy="8" r="10" />
        <path d="M 83 17 Q 90 13 97 17 L 104 40 L 78 40 Z" />
        <!-- Brazo derecho en alto -->
        <path d="M 94 18 Q 106 -4 115 -25 Q 120 -23 116 -17 Q 108 4 98 22 Z" />
      </g>
    </g>
  </g>
</svg>
